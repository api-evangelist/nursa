gaps:
- No RFC 9457 application/problem+json.
- No stable, machine-readable error code or type URI — clients must string-match `message`.
- The `message` field is polymorphic (string or string[]) and the spec declares it inconsistently.
- No 429 response documented on any of the 40 operations, though a 100 req/min limit is published.
- No 5xx responses documented on any operation.
- No request/correlation id is returned on errors, so a failure cannot be tied to a support ticket.
