format: nestjs-http-exception
rfc9457: false
note: 'Nursa does NOT use RFC 9457 problem+json. Every error is the default NestJS HttpException envelope served
  as application/json: {message, error, statusCode}. `message` is a STRING for business-rule failures and an ARRAY
  OF STRINGS for request-validation failures — the same field carries two different types, and several in-spec examples
  declare `message` as a string while supplying an array, which is why the spec fails oas3-valid-media-example.
  There is no stable machine-readable error code anywhere in the contract: the only discriminator is the prose in
  `message`.'
envelope:
  media_type: application/json
  fields:
  - name: message
    type: string | string[]
    description: Error description. Array form is returned by request validation, one entry per failed constraint.
  - name: error
    type: string
    description: The type of error — the HTTP reason phrase (Bad Request, Forbidden, Not Found). Absent on 401.
  - name: statusCode
    type: integer
    description: HTTP status code, repeated in the body.
  error_code_field: null
  type_uri_field: null
  trace_id_field: null
