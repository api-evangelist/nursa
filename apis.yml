- aid: nursa:auth
  name: Nursa Authorization Server
  description: 'Nursa''s OpenID Connect / OAuth 2.0 authorization server. Issues the JWT access tokens the
    Nursa Public API requires, supports the authorization code (with and without PKCE), resource owner
    password, implicit, refresh token and client credentials grants, and publishes OIDC discovery metadata,
    a JWKS, authorization, token, userinfo and end-session endpoints. Resource scopes are namespaced per
    capability (marketplace, shift-requests, shift-reports, facilities, finances, permissions and more).'
  humanURL: https://docs.nursa.com/docs/Integration%20Guideline/Authentication/
  baseURL: https://auth.nursa.com/oidc
