aid: nursa
name: Nursa
description: 'Nursa is a healthcare staffing marketplace, founded in Salt Lake City in 2019, that connects
  credentialed per diem (PRN) clinicians — registered nurses, licensed practical nurses, certified nursing
  assistants, certified medication aides and allied professionals — directly with hospitals, skilled nursing
  facilities, long-term and post-acute care providers, removing the traditional staffing agency from the
  middle. Facilities post open shifts and set their own rates, clinicians browse and request shifts, and both
  sides settle through Nursa''s shift-report flow. Nursa publishes a Public API V2 (REST, JWT bearer, with an
  OpenID Connect / OAuth 2.0 authorization server) so workforce-management and scheduling platforms can post
  shifts, review requests, schedule clinicians, read clinician credentials and subscribe to webhooks — the
  integration surface behind its Covr, StaffLion, Dropstat, Maple and UKG partnerships. The company is
  accredited by The Joint Commission and reports more than 4,500 facilities and 500,000 clinicians nationwide.'
