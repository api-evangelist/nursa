apis:
- aid: nursa:public-api-v2
  name: Nursa Public API V2
  description: 'REST API for healthcare facilities and the workforce-management platforms that serve them.
    Post, quote, update and cancel per diem shifts on the Nursa marketplace; read and reject clinician shift
    requests; schedule and unschedule clinicians; accept, reject and cancel shift reports; search facilities
    and specialties; read clinician profiles, documents and license types; and manage facility- and user-scoped
    webhook subscriptions with signed, retried delivery. Authenticated with a JWT bearer token issued by the
    Nursa OIDC authorization server; sandbox and production environments are separate.'
  humanURL: https://docs.nursa.com/
  baseURL: https://public-api.prod.nursa.com
