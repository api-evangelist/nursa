  scope: application
  limit_count: null
  limit_period: null
  applies_to: https://auth.nursa.com/oidc/oauth/token
  note: >-
    No number is published. The Authentication guide warns that requesting a new token on every API
    call "may block your server due to the Rate Limiting" and recommends caching the token until it
    nears expiry — so a limit exists and is enforced, but is undocumented.
signaling:
