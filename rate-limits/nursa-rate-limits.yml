  note: >-
    No RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset (RFC 9239 / draft-ietf-httpapi-ratelimit)
    and no Retry-After are documented. A client cannot see how much budget it has left; it only finds
    out by being refused.
