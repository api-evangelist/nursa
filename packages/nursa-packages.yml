detail: >-
  Nursa publishes NO first-party client library in any language. Searched the npm registry
  (registry.npmjs.org search for "nursa" — no Nursa-authored package), PyPI (nursa, nursa-api,
  nursa-sdk all 404), and the public github.com/nursa-com organization, whose seven public repos
  are a US federal-holidays utility, an Airbyte fork, a Mage Terraform-templates fork, Helm charts,
  a Swift photo viewer, a HyperTrack Ionic/Capacitor SDK wrapper and Slack data-eng workflows —
  infrastructure, not an API client. The developer page and the docs offer no download, no code
  samples beyond three webhook-signature verification snippets (Python, JavaScript, Java), and no
  Postman collection or workspace.
