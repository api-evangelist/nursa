blockers:
- Auth is the real blocker, not transport. Every Nursa action must be attributable to a facility user
  with access to the target facility, and the client-credentials grant is enabled only on request. An
  MCP server would need the OAuth authorization-code flow per user, plus /.well-known/oauth-protected-resource
  (currently absent) for a client to discover it.
- Twenty resource scopes are documented in prose but every operation declares an EMPTY scope array, so
  a tool cannot compute the least-privilege token it needs.
- No idempotency key. The write tools below are financially consequential; an agent that retries createShifts
  can double-post a facility's shifts with no way to detect it.
