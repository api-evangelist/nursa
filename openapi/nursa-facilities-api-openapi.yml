  /api/v2/public/facilities/{facilityId}/work-history:
    get:
      operationId: FacilitiesController_getWorkHistory
      summary: Get Facility Work History
      description: '<p>Return data of clinicians that have completed a shift for the given Facility.</p>

        <p>The data will be sorted based on the Shift Start Date.</p>

        '
      tags:
      - Facilities
      security:
      - public-api: []
      parameters:
      - name: facilityId
        required: true
        in: path
        description: Id of the facility
        example: NUR-12345
        schema:
          type: string
      - name: limit
        required: false
        in: query
        example: 10
        description: Pagination parameter, use to specify the quantity of records returned
        schema:
          minimum: 0
          maximum: 50
          default: 10
          type: number
      - name: offset
        required: false
        in: query
        example: 10
        description: Pagination parameter, use to specify the number of records to skip before starting to return results
        schema:
          minimum: 0
          default: 0
          type: number
      - name: sortDirection
        required: false
        in: query
        example: DESC
        description: Pagination parameter, use to specify the order of records by creation date, either 'asc' for ascending or 'desc' for descending
        schema:
          default: DESC
          enum:
          - ASC
          - DESC
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        clinicianId:
                          type: string
                          description: Id of the Clinician
                          example: I7002epLHLhBCypdPCrn9XP4kTN2
                        firstName:
                          type: string
                          example: Mary
                          description: First Name of the Clinician
                        lastName:
                          type: string
                          example: Jane
                          description: Last Name of the Clinician
                        isFavorited:
                          type: boolean
                          example: false
                          description: Indicates if the Clinician is favorited
                        lastShiftDate:
                          type: sting
                          example: '2025-09-15T10:23:18.087Z'
                          format: date-time
                          description: The date of the last shift worked by the Clinician
                      required:
                      - clinicianId
                      - firstName
                      - lastName
                      - isFavorited
