  /api/v2/public/facilities/connection:
    post:
      operationId: FacilitiesController_requestConnection
      summary: Request Facility Connection
      description: |
        <p>This endpoint allows users to request a connection to an existing facility in our application. The user must provide the <code>facilityId</code> in the request body payload. Once the request is submitted, a Nursa employee will review and either accept or reject the request.</p>
