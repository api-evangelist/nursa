      description: |
        <h3>General Information</h3>
        <p>This endpoint returns shifts for the facilities that user is connected to.</p>
      tags:
      - Marketplace
      security:
      - public-api: []
      parameters:
      - name: limit
        required: false
        in: query
        example: 10
        description: Pagination parameter, use to specify the quantity of records returned
        schema:
          minimum: 0
          maximum: 50
          default: 10
          type: number
      - name: offset
        required: false
        in: query
        example: 10
        description: Pagination parameter, use to specify the number of records to skip before starting to return results
        schema:
          minimum: 0
          default: 0
          type: number
      - name: sortDirection
        required: false
        in: query
        example: DESC
        description: Pagination parameter, use to specify the order of records by creation date, either 'asc' for ascending
          or 'desc' for descending
        schema:
          default: DESC
          enum:
          - ASC
          - DESC
          type: string
      - name: facilityId
        required: false
        in: query
        description: Id of the facility
        example: NUR-12345
        schema:
          type: string
      - name: startDateFrom
        required: false
        in: query
        description: When you provide date-time value, time is ignored and will take the start of the day for the given date
          (00:00:00). When startDateTo is provided this becomes mandatory
        example: '2025-09-15T10:23:17.661Z'
        schema:
          format: date-time
          type: string
      - name: startDateTo
        required: false
        in: query
        description: When you provide date-time value, time is ignored and will take end of the day for given date (23:59:59)
        example: '2025-09-15T10:23:17.661Z'
        schema:
          format: date-time
          type: string
      - name: shiftId
        required: false
        in: query
        description: Id of the shift
