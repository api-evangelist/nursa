                        description: Description of the Shift
                      from:
                        type: string
                        format: date-time
                        description: Shift start date
                        example: '2022-09-13T00:00:00.000Z'
                      to:
                        type: string
                        format: date-time
                        description: Shift end date
                        example: '2022-09-14T00:00:00.000Z'
