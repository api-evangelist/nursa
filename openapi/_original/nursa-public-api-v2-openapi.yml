  /api/v2/public/marketplace/shifts/quote/{quoteId}/shift:
    post:
      operationId: MarketplaceController_createShiftFromQuote
      summary: Create shift from quote
      description: |
        <h3>General Information</h3>
        <p>Based on previously <a href="marketplace-controller-quote-shift" target="_blank">created quote</a> you can now create a shift.</p>
        <p>If the facility for which you are creating the shift has the <strong>Auto Schedule</strong> feature enabled, the shifts will inherit the same Auto Schedule settings by default.</p>
        <ul>
        <li>To enable only specific Auto Schedule options, use the <code>autoScheduleSettings</code> property in the request body to specify the desired options.</li>
        <li>To create a shift <strong>without any Auto Schedule options</strong>, even if the facility has this feature enabled, set <code>autoScheduleSettings</code> to <code>null</code> or an empty array (<code>[]</code>).</li>
        </ul>
        <h3>Potential issues</h3>
        <ul>
        <li><strong>Quoted shift not found</strong> Quote has expired</li>
        <li><strong>Auto schedule option is not enabled for this facility</strong> The facility for which you are creating the shift does not have the specified Auto Schedule option enabled</li>
        </ul>
      tags:
      - Marketplace
      security:
      - public-api: []
      parameters:
      - name: quoteId
        required: true
        in: path
        description: Shift QuoteId
        example: 86137ed9-b78d-4b8d-96f0-d63a6296a60b
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      shiftId:
                        type: string
                        example: '12120878'
                        description: Id of the shift
                      facilityId:
                        type: string
                        description: Id of the Facility
                        example: NUR-0879
                      description:
                        type: string
