                        shiftId:
                          type: string
                          example: '12120878'
                          description: Id of the shift
                        facilityId:
                          type: string
                          description: Id of the Facility
                          example: NUR-0879
                        from:
                          type: string
                          description: Shift start date
                          format: date-time
