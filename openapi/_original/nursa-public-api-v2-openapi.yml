                        - contactPhone
                        title: BillingInformationRequestDto
                      specialty:
                        type: string
                        description: Name of the facility specialty
                      websiteUrl:
                        type: string
                        description: Website URL of the facility
                    required:
                    - requestId
                    - name
                    - type
                    - category
                    - numberOfBeds
                    - streetAddress
                    - cityName
                    - zipCode
                    - stateCode
                    - county
                    - contactPhone
