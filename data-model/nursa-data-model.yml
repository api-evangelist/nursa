lifecycle_flow:
- Facility connection requested and accepted (FacilitiesController_requestConnection)
- Shift quoted (MarketplaceController_quoteShift) or created directly (MarketplaceController_createShifts)
- Clinician requests the shift -> shift.request.created
- Facility schedules the clinician (ScheduleShiftsController_scheduleShift) -> shift.scheduled, all other requests cancelled
- Clinician works the shift and submits a shift report -> shift.report.created
- Facility accepts or rejects within 48 hours, else the system auto-accepts -> shift.report.accepted[-automatically] | rejected
gaps:
- >-
  The spec defines no components.schemas at all — every request and response body is inlined per
  operation, so there is zero schema reuse, no named entity a code generator can bind to, and the
  same Facility or Shift shape is redeclared in operation after operation. This is the single
  highest-leverage structural fix available to Nursa's spec.
- No state/status enumeration is published for Shift or ShiftReport, though error messages leak
  real state names (Paid, CancelledFilledInternally).
